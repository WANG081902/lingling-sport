<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8F66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB088;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGradient)"/>
  
  <!-- 装饰圆环 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
  
  <!-- 火焰/闪电图标 -->
  <path d="M276 100 L210 220 L260 220 L236 340 L320 200 L272 200 L296 100 Z" 
        fill="url(#flameGradient)" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="2"/>
  
  <!-- 底部文字 -->
  <text x="256" y="430" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="4">玲玲你好</text>
  
  <!-- 运动小图标 - 跑步人形 -->
  <g transform="translate(380, 120) scale(0.6)">
    <circle cx="20" cy="10" r="10" fill="rgba(255,255,255,0.9)"/>
    <path d="M15 25 L25 25 L30 45 L20 50 L10 45 L15 25 Z" fill="rgba(255,255,255,0.9)"/>
    <path d="M10 30 L0 40 M30 30 L40 35 M15 50 L10 65 M25 50 L35 60" 
          stroke="rgba(255,255,255,0.9)" 
          stroke-width="4" 
          stroke-linecap="round"
          fill="none"/>
  </g>
</svg>
